<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <main class="container">

        <div class="logo">
            <img src="logo.png" alt="Logo Senac">
        </div>

        <form id="formCadastro">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >

            <input
                type="password"
                id="confirmarSenha"
                placeholder="Confirmar Senha"
                required
            >

            <button type="submit">
                CADASTRAR
            </button>

        </form>

        <a href="index-login.html" class="voltar">
            Já possui cadastro? Faça login
        </a>

        <p id="mensagem"></p>

    </main>

    <script src="cadastro.js"></script>

</body>
</html>
